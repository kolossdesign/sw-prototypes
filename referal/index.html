  function useInView() {
    const ref = useRef(null);
    const [inView, setInView] = useState(false);
    useEffect(() => {
      const el = ref.current;
      if (!el || !('IntersectionObserver' in window)) { setInView(true); return undefined; }
      const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setInView(true); io.disconnect(); } }, { threshold: 0.6 });
      io.observe(el);
      return () => io.disconnect();
    }, []);
    return [ref, inView ? ' is-in' : ''];
  }

  const PROD_FIX = `
    :host { display: block; font-family: Gerbera, sans-serif; color: #141414; background: #fff; -webkit-text-size-adjust: 100%; }
    .prod-root { overflow-x: hidden; }
    .ref-slot { padding: 16px 16px 0; }
    /* WHY: JS-слайдеров прода нет — превращаем их в нативный горизонтальный скролл со снапом */
    .swiper-wrapper, .osn-slider__wrapper { transform: none !important; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .swiper-wrapper::-webkit-scrollbar, .osn-slider__wrapper::-webkit-scrollbar { display: none; }
    .swiper-slide, .osn-slider__slide { scroll-snap-align: start; flex-shrink: 0; }
    /* JS прода сдвигал ленту товаров на 16px трансформом — возвращаем отступ паддингом */
    .osn-slider__wrapper { padding: 0 16px; scroll-padding: 0 16px; box-sizing: border-box; }
    [data-go] { cursor: pointer; }
    /* Главный слайдер: JS прода выставлял ширину слайда 375px и высоту обёртки — делаем резиновым */
    .im21--main-banner-slider .swiper-wrapper { height: auto !important; }
    .im21--main-banner-slider .swiper-slide { width: 100% !important; }
  `;
  function ProdMain({ go, children }) {
    const host = useRef(null);
    useEffect(() => {
      const el = host.current;
      const root = el.shadowRoot || el.attachShadow({ mode: 'open' });
      let alive = true;
      fetch('assets/main-prod.html').then((r) => r.text()).then((html) => {
        if (!alive) return;
        root.innerHTML = '<link rel="stylesheet" href="assets/main-prod.css"><style>' + PROD_FIX + '</style>' + html;
        // Точки главного слайдера следуют за свайпом, стартуем с первого слайда
        const wrap = root.querySelector('.im21--main-banner-slider .swiper-wrapper');
        const dots = [...root.querySelectorAll('.im21--main-banner-slider .im21--pagination__bullet')];
        if (wrap && dots.length) {
          const sync = () => {
            const i = Math.round(wrap.scrollLeft / wrap.clientWidth);
            dots.forEach((d, k) => d.classList.toggle('im21--pagination__bullet_active', k === i));
          };
          wrap.scrollLeft = 0; sync();
          wrap.addEventListener('scroll', sync, { passive: true });
        }
      });
      const onClick = (e) => {
        const card = e.target.closest('[data-go]');
        if (card) { e.preventDefault(); go(card.getAttribute('data-go')); return; }
        if (e.target.closest('a')) e.preventDefault();
      };
      root.addEventListener('click', onClick);
      return () => { alive = false; root.removeEventListener('click', onClick); };
    }, []);
    return <div ref={host}>{children}</div>;
  }

          {items1.map((it) => <button type="button" className="menuItem" key={it} onClick={() => tap(it)}>{it}</button>)}
          {STATE === 'active' && <Banner60 onOpen={() => open('refs')} />}
          {items2.map((it) => <button type="button" className="menuItem" key={it}>{it}</button>)}
          <div className="menuDivider" />
          <button type="button" className="menuItem">Выйти</button>
        </div>
      </div>
    );
  }

  /* ---------- Приложение ---------- */
  function App() {
    const [stack, setStack] = useState([{ s: START }]);
    const [sheet, setSheet] = useState(null);
    const [howFrom, setHowFrom] = useState(null); // шторка, из которой открыли «Как это работает»
    const [menu, setMenu] = useState(false);
    const [toast, setToast] = useState(false);
    const toastT = useRef(null);
    const scrollRef = useRef(null);
    const cur = stack[stack.length - 1];

    useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = 0; }, [stack.length, cur.s]);

    const go = (s, title) => {
      const from = sheet;
      setSheet(null); setMenu(false);
      if (['main', 'product', 'thanks'].includes(s)) setStack([{ s }]);
      // WHY: «Назад» должен вернуть в ту же шторку, из которой ушли (как на проде в этом же окне)
      else setStack((st) => [...st.slice(0, -1), { ...st[st.length - 1], sheet: from }, { s, title }]);
    };
    const back = () => {
      if (stack.length < 2) return;
      const prev = stack[stack.length - 2];
      setStack(stack.slice(0, -1)); setSheet(prev.sheet || null);
    };
    // «Как это работает» открывается шторкой поверх, остальное — экранами
    const goFromSheet = (s, title) => {
      if (s === 'how') { setHowFrom(sheet); setSheet('how'); } else go(s, title);
    };
    // WHY: «Как это работает» — вложенный попап; закрытие возвращает в попап, из которого его открыли
    const closeSheet = () => setSheet(sheet === 'how' && howFrom ? howFrom : null);
    const open = (name) => { setMenu(false); setSheet(name); };
    const copy = () => {
      // WHY: на http/в iframe буфер может быть запрещён — тост показываем в любом случае
      try { navigator.clipboard.writeText('https://ru.siberianhealth.com/ru/?referral=' + REF_NO).catch(() => {}); } catch (e) { /* noop */ }
      setToast(true); clearTimeout(toastT.current); toastT.current = setTimeout(() => setToast(false), 2000);
    };

    const sub = cur.s === 'bo' || cur.s === 'reg';
    return (
      <div className="sw">
        <div className="scroll" ref={scrollRef}>
          {cur.s === 'main' && <MainScreen open={open} go={go} />}
          {cur.s === 'product' && <ProductScreen open={open} go={go} />}
          {cur.s === 'thanks' && <ThanksScreen open={open} />}
          {cur.s === 'bonus' && (<>{stack.length > 1 && <button type="button" className="topBack" onClick={back}><span style={{ fontSize: 20 }}>‹</span> Назад</button>}<BonusScreen /></>)}
          {cur.s === 'reg' && (<><button type="button" className="topBack" onClick={back}><span style={{ fontSize: 20 }}>‹</span> Назад</button><img className="slice" src="assets/reg.jpg" alt="" /></>)}
          {cur.s === 'bo' && <BoStub title={cur.title} back={back} />}
        </div>
        {!sub && <TabBar on={menu ? 'profile' : ''} go={go} openMenu={() => setMenu(true)} />}

        {menu && <Menu onClose={() => setMenu(false)} open={open} go={go} />}
        {sheet && (
          <div className="scrim" onClick={closeSheet}>
            <div className="sheet" onClick={(e) => e.stopPropagation()} style={{ position: 'relative' }}>
              {sheet === 'refs' && <RefsSheet onClose={() => setSheet(null)} go={goFromSheet} copy={copy} />}
              {sheet === 'share' && <ShareSheet onClose={() => setSheet(null)} go={goFromSheet} copy={copy} />}
              {sheet === 'how' && <HowSheet onClose={closeSheet} go={goFromSheet} />}
            </div>
          </div>
        )}
        {toast && <div className="toast"><i>!</i>{T.copied}</div>}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
