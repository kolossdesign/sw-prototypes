  .banner {
    position: relative; display: flex; flex-direction: column; align-items: flex-start; width: 100%;
    border: none; text-align: left; border-radius: 16px; overflow: hidden; cursor: pointer; color: #fff;
    background: var(--navy); box-sizing: border-box; padding: 18px 16px 20px; isolation: isolate;
  }
  /* Размытый отсвет (пятна из SVG макета) — отдельным слоем, чтобы выезжал справа при появлении баннера */
  .banner::before, .pHead::before {
    content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background: var(--glow) right center / cover no-repeat;
    opacity: 0; transform: translateX(45%) scale(1.15);
  }
  .banner.is-in::before, .pHead::before { animation: glowIn 1.4s cubic-bezier(.2, .7, .2, 1) .15s forwards; }

  @media (prefers-reduced-motion: reduce) { .banner::before, .pHead::before { animation: none !important; opacity: 1; transform: none; } }

  .banner--104 { min-height: 104px; --glow: url(assets/glow-banner-104.svg); }

  .banner--60  .coins { right: -1px; top: -7px; width: 110px; }

  .banner--104 .bTitle { padding-right: 56px; }

  /* Анимация отсвета стартует, когда баннер впервые попал в экран, а не при загрузке страницы */
  function useInView() {
    const ref = useRef(null);
    const [inView, setInView] = useState(false);
    useEffect(() => {
      const el = ref.current;
      if (!el || !('IntersectionObserver' in window)) { setInView(true); return undefined; }
      const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setInView(true); io.disconnect(); } }, { threshold: 0.6 });
      io.observe(el);
      return () => io.disconnect();
    }, []);
    return [ref, inView ? ' is-in' : ''];
  }

  const PROD_FIX = `
    :host { display: block; font-family: Gerbera, sans-serif; color: #141414; background: #fff; -webkit-text-size-adjust: 100%; }
    .prod-root { overflow-x: hidden; }
    /* WHY: JS-слайдеров прода нет — превращаем их в нативный горизонтальный скролл со снапом */
    .swiper-wrapper, .osn-slider__wrapper { transform: none !important; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .swiper-wrapper::-webkit-scrollbar, .osn-slider__wrapper::-webkit-scrollbar { display: none; }
    .swiper-slide, .osn-slider__slide { scroll-snap-align: start; flex-shrink: 0; }
    [data-go], [data-share] { cursor: pointer; }
  `;
  const MAIN_FIX = `
    .ref-slot { padding: 16px 16px 0; }
    /* JS прода сдвигал ленту товаров на 16px трансформом — возвращаем отступ паддингом */
    .osn-slider__wrapper { padding: 0 16px; scroll-padding: 0 16px; box-sizing: border-box; }
    /* Главный слайдер: JS прода выставлял ширину слайда 375px и высоту обёртки — делаем резиновым */
    .im21--main-banner-slider .swiper-wrapper { height: auto !important; }
    .im21--main-banner-slider .swiper-slide { width: 100% !important; }
  `;
  const PRODUCT_FIX = `
    /* WHY: на мобилке CTA «В корзину» по макету 160px */
    [data-ref="buy"] .sw-button { width: 160px; flex: 0 0 160px; }
    [data-ref="buy"] { justify-content: space-between; }
    /* Пока программа активна, «Поделиться» живёт в баннере; после — дефолт прода */
    :host(.is-active) [data-ref="buy"] [data-share] { display: none; }
    /* Галерея: слайды на всю ширину */
    .pp-summary__slider .swiper-slide { width: 100% !important; }
    .pp-summary__slider .swiper-wrapper { height: auto !important; }
  `;
  function ProdPage({ page, fix, go, open, children }) {
    const host = useRef(null);
    useEffect(() => {
      const el = host.current;
      const root = el.shadowRoot || el.attachShadow({ mode: 'open' });
      let alive = true;
      fetch('assets/' + page + '-prod.html').then((r) => r.text()).then((html) => {
        if (!alive) return;
        root.innerHTML = '<link rel="stylesheet" href="assets/' + page + '-prod.css"><style>' + PROD_FIX + fix + '</style>' + html;
        // Точки слайдеров следуют за свайпом, стартуем с первого слайда
        root.querySelectorAll('.swiper-container').forEach((box) => {
          const wrap = box.querySelector('.swiper-wrapper');
          const dots = [...(box.parentElement || box).querySelectorAll('.im21--pagination__bullet, .swiper-pagination-bullet')];
          if (!wrap) return;
          wrap.scrollLeft = 0;
          if (!dots.length) return;
          const cls = dots[0].classList.contains('im21--pagination__bullet') ? 'im21--pagination__bullet_active' : 'swiper-pagination-bullet-active';
          const sync = () => {
            const i = Math.round(wrap.scrollLeft / (wrap.clientWidth || 1));
            dots.forEach((d, k) => d.classList.toggle(cls, k === i));
          };
          sync(); wrap.addEventListener('scroll', sync, { passive: true });
        });
      });
      const onClick = (e) => {
        const target = e.target.closest('[data-go]');
        if (target) { e.preventDefault(); go(target.getAttribute('data-go')); return; }
        if (e.target.closest('[data-share]')) { e.preventDefault(); open('share'); return; }
        if (e.target.closest('a')) e.preventDefault();
      };
      root.addEventListener('click', onClick);
      return () => { alive = false; root.removeEventListener('click', onClick); };
    }, []);
    return <div ref={host} className={STATE === 'active' ? 'is-active' : ''}>{children}</div>;
  }

  /* «Поделиться» как на проде: сетка соцсетей, поле со ссылкой и кнопка копирования.
     Клик по полю или кнопке выделяет ссылку, копирует и показывает тост */
  function ShareSheet({ onClose, go, copy }) {
    const box = useRef(null);
    const url = 'https://ru.siberianhealth.com/ru/shop/catalog/product/501671/?referral=' + REF_NO;
    const pick = () => {
      const sel = window.getSelection();
      if (sel && box.current) sel.selectAllChildren(box.current);
      copy(url);
    };
    return (
      <>
        {STATE === 'none'
          ? <div className="sheetPlainHead"><button type="button" className="sheetClose" aria-label="Закрыть" onClick={onClose}><Close /></button></div>
          : <ProgramHead onClose={onClose} go={go} />}
        <div className="share" style={STATE === 'none' ? { paddingTop: 0 } : null}>
          <h2 className="h1">{T.shareTitle}</h2>
          <div className="shareGrid">
            {SHARE_ICONS.map((svg, k) => <button type="button" key={k} className="shareItem" onClick={pick} dangerouslySetInnerHTML={{ __html: svg }} />)}
          </div>
          <div className="shareField" ref={box} onClick={pick}>{REF_URL}<b>{REF_NO}</b></div>
          <button type="button" className="btn shareCopy" onClick={pick}>Скопировать реферальную ссылку</button>
        </div>
      </>
    );
  }

  function HowSheet({ onClose, go }) {
    return (
      <>
        <div className="sheetPlainHead">
          <button type="button" className="sheetClose" aria-label="Закрыть" onClick={onClose}><Close /></button>
        </div>
        <div className="how">
          <h2 className="h1">{T.howTitle}</h2>
          {T.howSteps.map((s, i) => <div className="step" key={s}><i>{i + 1}</i><span>{s}</span></div>)}
          <div className="step"><i className="emoji">🎉</i><span>{T.howDone}</span></div>
          <button type="button" className="textLink" onClick={() => go('bo', 'Условия программы')}>{T.howTerms} <Chevron /></button>
        </div>
      </>
    );
  }

  function Menu({ onClose, open, go }) {
    const items1 = ['Личный кабинет', 'Мои заказы', 'Бонусы и кэшбэк', 'Награды', 'Мои адреса', 'Программа лояльности', 'Мои реферальные ссылки'];
    const items2 = ['Мои подписки', 'Стать Бизнес-Партнером', 'Backoffice'];
    const tap = (it) => {
      if (it === 'Мои реферальные ссылки') open('refs');
      else if (it === 'Бонусы и кэшбэк') go('bonus');
    };
    const AWARDS = [['500', '#3bb08f'], ['5000', '#2f4fe0'], ['200', '#a6ce39'], ['1000', '#6a1fd1'], ['★', '#9b4de0']];
    return (
      <div className="menu">
        <div className="menuHead">
          <button type="button" className="sheetClose" aria-label="Закрыть" onClick={onClose}><Close /></button>
          <div className="menuUser"><span className="ava"><Snowflake color="#fff" size={30} /></span><span className="menuName">Алексей Батхитхарма Анатольевич</span></div>
          <div className="acc">
            <span>БОНУСНЫЙ СЧЕТ <span className="pill">152₽</span></span>
            <span>КЭШБЭК: <span className="pill">0%</span> <span className="infoDot">i</span></span>
          </div>
        </div>
        <div className="awards"><em>Награды</em>{AWARDS.map(([t, c]) => <span className="award" key={t} style={{ background: c }}>{t}</span>)}</div>
        <div className="menuList">
          {items1.map((it) => <button type="button" className="menuItem" key={it} onClick={() => tap(it)}>{it}</button>)}
          {STATE === 'active' && <Banner60 onOpen={() => open('refs')} />}
          {items2.map((it) => <button type="button" className="menuItem" key={it}>{it}</button>)}
          <div className="menuDivider" />
          <button type="button" className="menuItem">Выйти</button>
        </div>
      </div>
    );
  }

  /* ---------- Приложение ---------- */
  function App() {
    const [stack, setStack] = useState([{ s: START }]);
    const [sheet, setSheet] = useState(null);
    const [howFrom, setHowFrom] = useState(null); // шторка, из которой открыли «Как это работает»
    const [menu, setMenu] = useState(false);
    const [toast, setToast] = useState(false);
    const toastT = useRef(null);
    const scrollRef = useRef(null);
    const cur = stack[stack.length - 1];

    useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = 0; }, [stack.length, cur.s]);

    const go = (s, title) => {
      const from = sheet;
      setSheet(null); setMenu(false);
      if (['main', 'product', 'thanks'].includes(s)) setStack([{ s }]);
      // WHY: «Назад» должен вернуть в ту же шторку, из которой ушли (как на проде в этом же окне)
      else setStack((st) => [...st.slice(0, -1), { ...st[st.length - 1], sheet: from }, { s, title }]);
    };
    const back = () => {
      if (stack.length < 2) return;
      const prev = stack[stack.length - 2];
      setStack(stack.slice(0, -1)); setSheet(prev.sheet || null);
    };
    // «Как это работает» открывается шторкой поверх, остальное — экранами
    const goFromSheet = (s, title) => {
      if (s === 'how') { setHowFrom(sheet); setSheet('how'); } else go(s, title);
    };
    // WHY: «Как это работает» — вложенный попап; закрытие возвращает в попап, из которого его открыли
    const closeSheet = () => setSheet(sheet === 'how' && howFrom ? howFrom : null);
    const open = (name) => { setMenu(false); setSheet(name); };
    // url приходит из поля ссылки; из onClick прилетает событие — тогда копируем общую ссылку
    const copy = (url) => {
      const text = typeof url === 'string' ? url : 'https://ru.siberianhealth.com/ru/?referral=' + REF_NO;
      // WHY: на http/в iframe буфер может быть запрещён — тост показываем в любом случае
      try { navigator.clipboard.writeText(text).catch(() => {}); } catch (e) { /* noop */ }
      setToast(true); clearTimeout(toastT.current); toastT.current = setTimeout(() => setToast(false), 2000);
    };

    const sub = cur.s === 'bo' || cur.s === 'reg';
    return (
      <div className="sw">
        <div className="scroll" ref={scrollRef}>
          {cur.s === 'main' && <MainScreen open={open} go={go} />}
          {cur.s === 'product' && <ProductScreen open={open} go={go} />}
          {cur.s === 'thanks' && <ThanksScreen open={open} />}
          {cur.s === 'bonus' && (<>{stack.length > 1 && <button type="button" className="topBack" onClick={back}><span style={{ fontSize: 20 }}>‹</span> Назад</button>}<BonusScreen /></>)}
          {cur.s === 'reg' && (<><button type="button" className="topBack" onClick={back}><span style={{ fontSize: 20 }}>‹</span> Назад</button><img className="slice" src="assets/reg.jpg" alt="" /></>)}
          {cur.s === 'bo' && <BoStub title={cur.title} back={back} />}
        </div>
        {!sub && <TabBar on={menu ? 'profile' : ''} go={go} openMenu={() => setMenu(true)} />}

        {menu && <Menu onClose={() => setMenu(false)} open={open} go={go} />}
        {sheet && (
          <div className="scrim" onClick={closeSheet}>
            <div className="sheet" onClick={(e) => e.stopPropagation()} style={{ position: 'relative' }}>
              {sheet === 'refs' && <RefsSheet onClose={() => setSheet(null)} go={goFromSheet} copy={copy} />}
              {sheet === 'share' && <ShareSheet onClose={() => setSheet(null)} go={goFromSheet} copy={copy} />}
              {sheet === 'how' && <HowSheet onClose={closeSheet} go={goFromSheet} />}
            </div>
          </div>
        )}
        {toast && <div className="toast"><i>!</i>{T.copied}</div>}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
