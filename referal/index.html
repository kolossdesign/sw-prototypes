  :root {
    --brand: #00b0f0; --brand-d: #008cf7;
    --navy: #0b276f; --navy-ink: #06112e;
    --ink: #141414; --ink-2: #8b8d94; --line: #e1e2e4; --line-2: #ebecee;
    --bg: #f6f6f8; --white: #fff;
    --link: #1b8dbf; --cyan-link: #4dc6f4; --cyan-tint: #e2f6fd; --badge: #c7efff;
    --green: #2db46b; --red: #ff453a;
    --scrim: rgba(0, 0, 0, 0.4);
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--white); }
  #root { height: 100%; }
  .sw, .sw input, .sw button { font-family: 'Gerbera', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .sw {
    height: 100%; display: flex; flex-direction: column; position: relative;
    width: 100%; background: var(--white); color: var(--ink);
    font-size: 16px; -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  .sw button { -webkit-tap-highlight-color: transparent; }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .slice { display: block; width: 100%; height: auto; }
  .sliceWrap { position: relative; }
  /* WHY: прод вставлен скриншотами, кликабельные места поверх — прозрачные хотспоты в css-пикселях 375-сетки */
  .hot { position: absolute; background: transparent; border: none; padding: 0; cursor: pointer; }
  .pad { padding: 0 16px; }

  /* Баннер программы: фон из SVG макета, текст и монетки — живые слои.
     WHY: высота от макета (140/104/60) — минимальная, ширина резиновая; монетки прибиты к правому краю */
  .banner {
    position: relative; display: flex; flex-direction: column; align-items: flex-start; width: 100%;
    border: none; text-align: left; border-radius: 16px; overflow: hidden; cursor: pointer; color: #fff;
    background: var(--navy) right center / cover no-repeat; box-sizing: border-box; padding: 18px 16px 20px;
  }
  .banner--140 { min-height: 140px; background-image: url(assets/bg-banner-140.svg); }
  .banner--104 { min-height: 104px; background-image: url(assets/bg-banner-104.svg); }
  .banner--60  { min-height: 60px; justify-content: center; padding: 10px 16px; background-image: url(assets/bg-menu-60.svg); }
  .banner .coins { position: absolute; pointer-events: none; }
  .banner--140 .coins { right: -26px; top: 7px; width: 127px; }
  .banner--104 .coins { right: -26px; top: -11px; width: 127px; }
  .banner--60  .coins { right: -1px; top: -7px; width: 110px; }
  .bTitle, .bText, .bLink { position: relative; }
  .bTitle { font-size: 16px; font-weight: 500; line-height: 20px; padding-right: 96px; }
  .bText { margin-top: 8px; font-size: 14px; line-height: 18px; max-width: calc(100% - 96px); }
  .banner--60 .bText { margin-top: 0; max-width: calc(100% - 100px); }
  .banner--104 .bTitle { padding-right: 56px; }
  .bLink { margin-top: auto; padding-top: 14px; font-size: 14px; color: var(--cyan-link); display: flex; align-items: center; gap: 8px; }
  .bShare {
    position: absolute; right: 16px; top: 20px; width: 40px; height: 40px; border-radius: 12px;
    background: #fff; display: flex; align-items: center; justify-content: center; color: var(--navy-ink);
  }

  /* Таббар прода */
  .tabbar { flex: 0 0 auto; height: 52px; display: flex; border-top: 1px solid var(--line-2); background: #fff; }
  .tabbar button { flex: 1; background: none; border: none; display: flex; align-items: center; justify-content: center; color: var(--ink); cursor: pointer; padding: 0; }
  .tabbar button.is-on { color: var(--brand); }

  /* Шторки */
  .scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 20; display: flex; align-items: flex-end; animation: fade .2s ease; }
  .sheet {
    width: 100%; max-height: 92%; overflow-y: auto; background: #fff; border-radius: 16px 16px 0 0;
    animation: up .25s ease; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  }
  @keyframes up { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .sheetClose { position: absolute; right: 16px; top: 20px; width: 32px; height: 32px; border: none; background: none; padding: 0; cursor: pointer; color: var(--ink-2); display: flex; align-items: center; justify-content: center; }
  .sheetPlainHead { position: relative; height: 56px; }
  .sheetBack { position: absolute; left: 12px; top: 20px; height: 32px; border: none; background: none; padding: 0 4px; cursor: pointer; color: var(--link); font-size: 16px; display: flex; align-items: center; gap: 6px; }
  .sheetBack span { font-size: 22px; line-height: 1; }

  /* Шапка программы в шторке */
  .pHead { position: relative; color: #fff; padding: 48px 16px 20px; background: var(--navy) right top / cover no-repeat url(assets/bg-sheet-178.svg); min-height: 178px; box-sizing: border-box; border-radius: 16px 16px 0 0; }
  .pHead--ended { background-image: url(assets/bg-sheet-196.svg); padding-top: 64px; }
  .pHead .sheetClose { color: #fff; top: 20px; }
  .pHead .coins { position: absolute; right: 5px; top: 44px; width: 98px; pointer-events: none; }
  .pTitle { font-size: 16px; font-weight: 500; line-height: 20px; max-width: calc(100% - 88px); }
  .pHead--ended .pTitle { max-width: none; }
  .pText { font-size: 14px; line-height: 18px; margin-top: 10px; max-width: calc(100% - 96px); }
  .pHead--ended .pText { max-width: none; }
  .pLinks { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 16px; }
  .pLinks button { background: none; border: none; padding: 0; color: var(--cyan-link); font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .badge { position: absolute; left: 16px; top: 24px; background: var(--badge); color: var(--navy-ink); font-size: 14px; font-weight: 500; line-height: 24px; padding: 0 8px; border-radius: 4px; }

  .h1 { font-size: 24px; font-weight: 500; line-height: 30px; margin: 0; color: var(--navy-ink); }
  .refs { padding: 24px 16px 8px; }
  .info { display: flex; gap: 12px; align-items: flex-start; background: var(--cyan-tint); border-radius: 8px; padding: 14px 16px; margin: 20px 0 8px; font-size: 14px; line-height: 18px; }
  .info i { flex: 0 0 20px; height: 20px; border-radius: 50%; background: var(--brand); color: #fff; font-style: normal; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: -1px; }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: none; border-bottom: 1px solid var(--line); padding: 16px 0; text-align: left; cursor: pointer; color: inherit; }
  .row:last-child { border-bottom: none; }
  .row .t { flex: 1; font-size: 16px; line-height: 22px; font-weight: 500; }
  .row .t--link { color: var(--link); }
  .row .sub { display: block; font-size: 14px; line-height: 18px; color: var(--ink-2); font-weight: 400; margin-top: 4px; }
  .row svg { flex: 0 0 auto; color: var(--ink); }

  .share { padding: 24px 16px 8px; }
  .apps { display: flex; gap: 12px; overflow-x: auto; margin: 20px -16px 0; padding: 0 16px 4px; scrollbar-width: none; }
  .apps::-webkit-scrollbar { display: none; }
  .app { flex: 0 0 auto; width: 64px; background: none; border: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
  .app span { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; }
  .linkBox { display: flex; gap: 4px; margin-top: 20px; }
  .linkBox div { flex: 1; min-width: 0; height: 48px; border: 1px solid #c4c6cc; border-radius: 4px; display: flex; align-items: center; padding: 0 12px; font-size: 16px; white-space: nowrap; overflow: hidden; }
  .linkBox b { color: var(--green); font-weight: 500; }
  .linkBox button { flex: 0 0 48px; height: 48px; border: none; border-radius: 4px; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .oldGrid { display: grid; grid-template-columns: repeat(6, 40px); justify-content: space-between; row-gap: 16px; margin-top: 16px; }
  .oldGrid button { width: 40px; height: 40px; border-radius: 50%; border: none; background: #eef0f2; color: #8b8d94; font-size: 10px; font-weight: 700; cursor: pointer; }
  .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 44px; border: none; border-radius: 4px; background: var(--brand); color: #fff; font-size: 16px; cursor: pointer; }
  .btn--ghost { background: #fff; color: var(--ink); border: 1px solid #c4c6cc; }

  .how { padding: 0 16px 16px; }
  .step { display: flex; gap: 16px; align-items: flex-start; margin-top: 16px; font-size: 14px; line-height: 18px; }
  .step i { flex: 0 0 28px; height: 28px; border-radius: 50%; background: #b3e8fb; font-style: normal; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .step i.emoji { background: none; font-size: 22px; }
  .textLink { background: none; border: none; padding: 0; color: var(--link); font-size: 14px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; margin-top: 24px; }

  /* Тост «Ссылка скопирована» */
  .toast {
    position: absolute; left: 16px; right: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 40;

          <span className="bo">BackOffice</span>
          <h1 className="h1">{title}</h1>
          <p>Здесь открывается страница BackOffice в этом же окне. В прототипе она не реализована.</p>
        </div>
      </>
    );
  }

  /* ---------- Шторки ---------- */
  function ProgramHead({ onClose, go }) {
    if (STATE === 'none') return <div className="sheetPlainHead"><button type="button" className="sheetClose" aria-label="Закрыть" onClick={onClose}><Close /></button></div>;
    const ended = STATE === 'ended';
    return (
      <div className={'pHead' + (ended ? ' pHead--ended' : '')}>
        {ended ? <span className="badge">{T.ended}</span> : <Coins />}
        <button type="button" className="sheetClose" aria-label="Закрыть" onClick={onClose}><Close /></button>
        <div className="pTitle">{T.headTitle}</div>
        <div className="pText">{ended ? T.headEnded : T.headActive}</div>
        <div className="pLinks">
          {ended
            ? <button type="button" onClick={() => go('bo', 'Условия программы')}>{T.terms} <Chevron /></button>
            : <button type="button" onClick={() => go('how')}>{T.how} <Chevron /></button>}
          <button type="button" onClick={() => go('bonus')}>{T.history} <Chevron /></button>
        </div>
      </div>
    );
  }

  function RefsSheet({ onClose, go, copy }) {
    return (
      <>
        <ProgramHead onClose={onClose} go={go} />
        <div className="refs" style={STATE === 'none' ? { paddingTop: 0 } : null}>
          <h2 className="h1">{T.refsTitle}</h2>
          <div className="info"><i>i</i><span>{T.refsInfo}<b>{REF_NO}</b></span></div>
          {T.copyRows.map((r) => (
            <button type="button" className="row" key={r} onClick={copy}><span className="t t--link">{r}</span><CopyIcon /></button>
          ))}
          <button type="button" className="row" onClick={() => go('bo', 'Генерация реферальных ссылок')}>
            <span className="t">{T.bo.t}<span className="sub">{T.bo.s}</span></span><Chevron size={14} />
          </button>
          <button type="button" className="row" onClick={() => go('reg')}>
            <span className="t">{T.forClient.t}<span className="sub">{T.forClient.s}</span></span><Chevron size={14} />
          </button>
        </div>
      </>
    );
  }

  const APPS = [
    { n: 'QR код', c: '#c4c6cc', g: 'QR' }, { n: 'Telegram', c: '#2aa3da', g: 'TG' }, { n: 'WhatsApp', c: '#2cd46b', g: 'WA' },
    { n: 'Ок', c: '#f29400', g: 'OK' }, { n: 'Вконтакте', c: '#0077ff', g: 'VK' }, { n: 'Viber', c: '#7360f2', g: 'VB' },
  ];
  const OLD_APPS = ['QR', 'VK', 'OK', '@', 'WA', 'FB', 'SMS', '✉', 'PR', '★', 'XI', 'LJ', 'WB', 'P', 't', 'TG'];

  function ShareSheet({ onClose, go, copy }) {
    const link = <div>{REF_URL}<b>{REF_NO}</b></div>;
    if (STATE === 'none') {
      /* Текущий прод: без шапки программы, сетка соцсетей и кнопка копирования */
      return (
        <div className="share" style={{ position: 'relative', paddingTop: 20 }}>
          <button type="button" className="sheetClose" aria-label="Закрыть" onClick={onClose}><Close /></button>
          <h2 className="h1" style={{ marginTop: 28 }}>{T.shareTitle}</h2>
          <div className="oldGrid">{OLD_APPS.map((a) => <button type="button" key={a} onClick={copy}>{a}</button>)}</div>
          <div className="linkBox">{link}</div>
          <button type="button" className="btn" style={{ marginTop: 16 }} onClick={copy}>Скопировать реферальную ссылку</button>
        </div>
      );
    }
    return (
      <>
        <ProgramHead onClose={onClose} go={go} />
        <div className="share">
          <h2 className="h1">{T.shareTitle}</h2>
          <div className="apps">
            {APPS.map((a) => (
              <button type="button" className="app" key={a.n} onClick={copy}>
                <span style={{ background: a.c, fontWeight: 700, fontSize: 14 }}>{a.g}</span>{a.n}
              </button>
            ))}
          </div>
          <div className="linkBox">{link}<button type="button" aria-label="Скопировать ссылку" onClick={copy}><LinkIcon /></button></div>
        </div>
      </>
    );
  }

  function HowSheet({ onClose, onBack, go }) {
    return (
      <>
        <div className="sheetPlainHead">
          {onBack && <button type="button" className="sheetBack" onClick={onBack}><span>‹</span> Назад</button>}
          <button type="button" className="sheetClose" aria-label="Закрыть" onClick={onClose}><Close /></button>
        </div>
        <div className="how">
          <h2 className="h1">{T.howTitle}</h2>
          {T.howSteps.map((s, i) => <div className="step" key={s}><i>{i + 1}</i><span>{s}</span></div>)}
          <div className="step"><i className="emoji">🎉</i><span>{T.howDone}</span></div>
          <button type="button" className="textLink" onClick={() => go('bo', 'Условия программы')}>{T.howTerms} <Chevron /></button>
        </div>
      </>
    );
  }

  function Menu({ onClose, open, go }) {
    const items1 = ['Личный кабинет', 'Мои заказы', 'Бонусы и кэшбэк', 'Награды', 'Мои адреса', 'Программа лояльности', 'Мои реферальные ссылки'];
    const items2 = ['Мои подписки', 'Стать Бизнес-Партнером', 'Backoffice'];
    const tap = (it) => {
      if (it === 'Мои реферальные ссылки') open('refs');
      else if (it === 'Бонусы и кэшбэк') go('bonus');
    };
    const AWARDS = [['500', '#3bb08f'], ['5000', '#2f4fe0'], ['200', '#a6ce39'], ['1000', '#6a1fd1'], ['★', '#9b4de0']];
    return (
      <div className="menu">
        <div className="menuHead">
          <button type="button" className="sheetClose" aria-label="Закрыть" onClick={onClose}><Close /></button>
          <div className="menuUser"><span className="ava"><Snowflake color="#fff" size={30} /></span><span className="menuName">Алексей Батхитхарма Анатольевич</span></div>
          <div className="acc">
            <span>БОНУСНЫЙ СЧЕТ <span className="pill">152₽</span></span>
            <span>КЭШБЭК: <span className="pill">0%</span> <span className="infoDot">i</span></span>
          </div>
        </div>
        <div className="awards"><em>Награды</em>{AWARDS.map(([t, c]) => <span className="award" key={t} style={{ background: c }}>{t}</span>)}</div>
        <div className="menuList">
          {items1.map((it) => <button type="button" className="menuItem" key={it} onClick={() => tap(it)}>{it}</button>)}
          {STATE === 'active' && <Banner60 onOpen={() => open('refs')} />}
          {items2.map((it) => <button type="button" className="menuItem" key={it}>{it}</button>)}
          <div className="menuDivider" />
          <button type="button" className="menuItem">Выйти</button>
        </div>
      </div>
    );
  }

  /* ---------- Приложение ---------- */
  function App() {
    const [stack, setStack] = useState([{ s: START }]);
    const [sheet, setSheet] = useState(null);
    const [howFrom, setHowFrom] = useState(null); // шторка, из которой открыли «Как это работает»
    const [menu, setMenu] = useState(false);
    const [toast, setToast] = useState(false);
    const toastT = useRef(null);
    const scrollRef = useRef(null);
    const cur = stack[stack.length - 1];

    useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = 0; }, [stack.length, cur.s]);

    const go = (s, title) => {
      const from = sheet;
      setSheet(null); setMenu(false);
      if (['main', 'product', 'thanks'].includes(s)) setStack([{ s }]);
      // WHY: «Назад» должен вернуть в ту же шторку, из которой ушли (как на проде в этом же окне)
      else setStack((st) => [...st.slice(0, -1), { ...st[st.length - 1], sheet: from }, { s, title }]);
    };
    const back = () => {
      if (stack.length < 2) return;
      const prev = stack[stack.length - 2];
      setStack(stack.slice(0, -1)); setSheet(prev.sheet || null);
    };
    // «Как это работает» открывается шторкой поверх, остальное — экранами
    const goFromSheet = (s, title) => {
      if (s === 'how') { setHowFrom(sheet); setSheet('how'); } else go(s, title);
    };
    const open = (name) => { setMenu(false); setSheet(name); };
    const copy = () => {
      // WHY: на http/в iframe буфер может быть запрещён — тост показываем в любом случае
      try { navigator.clipboard.writeText('https://ru.siberianhealth.com/ru/?referral=' + REF_NO).catch(() => {}); } catch (e) { /* noop */ }
      setToast(true); clearTimeout(toastT.current); toastT.current = setTimeout(() => setToast(false), 2000);
    };

    const sub = cur.s === 'bo' || cur.s === 'reg';
    return (
      <div className="sw">
        <div className="scroll" ref={scrollRef}>
          {cur.s === 'main' && <MainScreen open={open} go={go} />}
          {cur.s === 'product' && <ProductScreen open={open} go={go} />}
          {cur.s === 'thanks' && <ThanksScreen open={open} />}
          {cur.s === 'bonus' && (<>{stack.length > 1 && <button type="button" className="topBack" onClick={back}><span style={{ fontSize: 20 }}>‹</span> Назад</button>}<BonusScreen /></>)}
          {cur.s === 'reg' && (<><button type="button" className="topBack" onClick={back}><span style={{ fontSize: 20 }}>‹</span> Назад</button><img className="slice" src="assets/reg.jpg" alt="" /></>)}
          {cur.s === 'bo' && <BoStub title={cur.title} back={back} />}
        </div>
        {!sub && <TabBar on={menu ? 'profile' : ''} go={go} openMenu={() => setMenu(true)} />}

        {menu && <Menu onClose={() => setMenu(false)} open={open} go={go} />}
        {sheet && (
          <div className="scrim" onClick={() => setSheet(null)}>
            <div className="sheet" onClick={(e) => e.stopPropagation()} style={{ position: 'relative' }}>
              {sheet === 'refs' && <RefsSheet onClose={() => setSheet(null)} go={goFromSheet} copy={copy} />}
              {sheet === 'share' && <ShareSheet onClose={() => setSheet(null)} go={goFromSheet} copy={copy} />}
              {sheet === 'how' && <HowSheet onClose={() => setSheet(null)} onBack={howFrom ? () => setSheet(howFrom) : null} go={goFromSheet} />}
            </div>
          </div>
        )}
        {toast && <div className="toast"><i>!</i>{T.copied}</div>}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
